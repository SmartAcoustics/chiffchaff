# cargo-release configuration: https://github.com/crate-ci/cargo-release

# Only release from main.
allow-branch = ["main"]

# Before the release commit, turn the changelog's Unreleased section into this
# version and start a new, empty Unreleased section above it.
pre-release-replacements = [
  # The section heading and its link label take the version and date.
  { file = "CHANGELOG.md", search = "Unreleased", replace = "{{version}}", min = 1 },
  { file = "CHANGELOG.md", search = "ReleaseDate", replace = "{{date}}", min = 1 },
  # The released version's link compares with the new tag instead of HEAD...
  { file = "CHANGELOG.md", search = '\.\.\.HEAD', replace = "...{{tag_name}}", min = 0, max = 1 },
  # ...or, for the first release, points at the tag itself.
  { file = "CHANGELOG.md", search = 'commits/HEAD', replace = "releases/tag/{{tag_name}}", min = 0, max = 1 },
  # A fresh Unreleased section and link for the next version.
  { file = "CHANGELOG.md", search = "<!-- next-header -->", replace = "<!-- next-header -->\n\n## [Unreleased] - ReleaseDate", exactly = 1 },
  { file = "CHANGELOG.md", search = "<!-- next-url -->", replace = "<!-- next-url -->\n[Unreleased]: https://github.com/SmartAcoustics/chiffchaff/compare/{{tag_name}}...HEAD", exactly = 1 },
]
