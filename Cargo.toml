[package]
name = "chiffchaff"
version = "0.9.1"
edition = "2024"
rust-version = "1.96"
authors = ["Henry Gomersall <henry.gomersall@smartacoustics.co.uk>"]
description = "Identifies exactly which build of a piece of software is running, in a record that fits a DNS TXT string."
license = "MIT OR Apache-2.0"   # or whichever licence you choose
repository = "https://github.com/SmartAcoustics/chiffchaff"
readme = "README.md"
keywords = ["version", "build-info", "git", "no-std", "dns"]
categories = ["development-tools::build-utils", "no-std"]

[package.metadata.docs.rs]
all-features = true

[features]
# Build-script support (`magpie_version::build::emit`). Enable only on the
# build-dependency; the normal dependency stays no_std.
build = ["snafu/std", "dep:vergen-gitcl", "dep:serde_json", "dep:anyhow"]

[dependencies]
# `rust_1_81` implements `core::error::Error`, so errors work without std.
snafu = { version = "0.9.2", default-features = false, features = ["rust_1_81"] }
vergen-gitcl = { version = "10", optional = true }
serde_json = { version = "1", optional = true }
# vergen's error type; only named so it can be wrapped as an error source.
anyhow = { version = "1", optional = true }
